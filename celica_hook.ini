; CELICA_HOOK 配置文件
; 注释以分号开头

[General]
; 启用或禁用功能
EnableFileRedirect=1
EnableFontHook=1
EnableCodepageHook=1
EnableWindowTitleHook=1
EnableLogging=1

[FileRedirect]
; 文件重定向文件夹
RedirectFolder=CHSFiles

[Font]
; 字体配置
; 字体名称，留空使用系统默认
FontName=黑体
; 字符集 (十六进制)
; 0x80: Shift-JIS (日文)
; 0x81: (韩文)
; 0x86: GB2312 (简体中文)
; 0x88: BIG5 (繁体中文)
Charset=0x86
; 字体高度 (0表示不修改)
FontHeight=0
; 字体宽度 (0表示不修改)
FontWidth=0
; 字体粗细 (0表示不修改)
FontWeight=0

[Codepage]
; 代码页配置
; 原代码页 (游戏原始编码)
SourceCodepage=932
; 目标代码页 (要转换成的编码)
TargetCodepage=936

[WindowTitle]
; 窗口标题配置
; 是否启用标题检查 (1=启用, 0=禁用)
EnableTitleCheck=1
; 原标题 (即便其是乱码。留空表示不检查)
OriginalWindowTitle=
; 新标题 (留空表示不修改)
NewWindowTitle=

[Logging]
; 日志文件路径
LogFile=celica_hook.log
