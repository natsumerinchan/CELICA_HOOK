; CELICA_HOOK 配置文件
; 注释以分号开头

[General]
; 启用(=1)或禁用(=0)功能
EnableFileRedirect=1
EnableFileSpoofing=0
EnableFontHook=1
EnableWindowTitleHook=0
EnableLocaleEmulation=0
EnableLogging=0

; 目标进程名称，用于DLL注入器（例如：game.exe）
TargetProcess=

[File]
; 文件重定向文件夹
RedirectFolder=CHSFiles
; 检查重定向文件扩展名(0=禁用，1=启用)
EnableExtensionCheck=0
; 重定向文件扩展名(逗号分隔，如 .txt,.bin)
RedirectExtensions=.txt,.bin
; 游戏目录外的路径是否仅按文件名匹配(1=启用，0=禁用)
; 启用后系统目录/外部目录中的同名文件也可能被重定向，慎用
EnableFilenameOnlyMatch=0

; 文件欺骗功能配置
; 隐藏的文件路径列表(逗号分隔，基于程序根目录的相对路径，如 data\file.txt,config\settings.ini；
; 位于游戏目录内的绝对路径亦可，会自动转换为相对路径)
SpoofedFiles=
; 隐藏的目录路径列表(逗号分隔，基于程序根目录的相对路径，如 temp\logs,cache\data；
; 位于游戏目录内的绝对路径亦可，会自动转换为相对路径)
SpoofedDirectories=

[Font]
; 字体配置
; 字体名称，留空使用系统默认
FontName=VL ゴシック
; 自定义字体文件名（从游戏根目录加载，如：custom_font.ttf）
FontFileName=
; 字符集 (十六进制)
; 0x80: Shift-JIS (日文)
; 0x81: (韩文)
; 0x86: GB2312 (简体中文)
; 0x88: BIG5 (繁体中文)
Charset=0x80
; 字体高度 (0表示不修改)
FontHeight=0
; 字体宽度 (0表示不修改)
FontWidth=0
; 字体粗细 (0表示不修改)
FontWeight=0

; 字体hook细粒度控制 (1=启用, 0=禁用)
; CreateFontA
EnableCreateFontA=1
; CreateFontW
EnableCreateFontW=0
; CreateFontIndirectA
EnableCreateFontIndirectA=1
; CreateFontIndirectW
EnableCreateFontIndirectW=0

[WindowTitle]
; 窗口标题配置
; 是否启用标题检查 (1=启用, 0=禁用)
EnableTitleCheck=1
; 原标题 (即便标题为乱码亦可。留空表示不检查)
OriginalWindowTitle=
; 新标题 (留空表示不修改)
NewWindowTitle=

[LocaleEmulation]
; 转区功能配置
; 转区字符集直接使用[Font]中的Charset
; 基于LocaleEmulatorPlus(LEP)，需要将对应架构的 LoaderDll_x86.dll+LocaleEmulatorPlus_x86.dll (32位)
; 或 LoaderDll_x64.dll+LocaleEmulatorPlus_x64.dll (64位) 放入游戏目录
; 代码页 (932=日文, 936=简体中文, 950=繁体中文)
LocaleCodepage=932
; 区域设置ID (1041=日文, 2052=简体中文, 1028=繁体中文)
LocaleId=1041
; 时区 (Tokyo Standard Time=东京时区, China Standard Time=中国标准时间)
Timezone=Tokyo Standard Time

[Logging]
; 日志文件路径（相对路径基于游戏目录解析；启动器日志固定写入 celica_hook_launcher.log）
LogFile=celica_hook.log
